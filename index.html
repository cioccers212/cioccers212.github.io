<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Babbu e Cochi - 12.09.2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- RESET E BASI --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100%; width: 100%; overflow: hidden; 
            font-family: 'Montserrat', sans-serif; background-color: #000;
        }

        .scroll-container {
            width: 100%; height: 100svh; overflow-y: scroll;
            scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch;
        }

        .slide {
            width: 100%; height: 100svh; scroll-snap-align: start;
            scroll-snap-stop: always; position: relative;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; z-index: 10;
        }

        /* --- 1. HOME --- */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url('sfondo1pagina.jpeg') center/cover no-repeat;
            color: white; justify-content: flex-start; padding-top: 15svh; z-index: 20;
        }

        /* --- LOGICA WRAPPER --- */
        .sticky-wrapper {
            height: 200svh; position: relative; z-index: 5; overflow: visible;
        }

        .sticky-bg-group {
            position: sticky; top: 0; width: 100%; height: 100svh;
            z-index: 1; overflow: hidden; transform: translateZ(0); -webkit-transform: translateZ(0);
        }

        /* SFONDI MESSA */
        .bg-messa-sharp { background: url('sfondo2pagina.jpeg') center/cover no-repeat; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        .bg-messa-blur { background: url('sfondo2pagina.jpeg') center/cover no-repeat; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; filter: blur(15px) brightness(0.85); -webkit-filter: blur(15px) brightness(0.85); }

        /* SFONDI RICEVIMENTO */
        .bg-ricevimento-sharp { background: url('sfondo3pagina.jpeg') center/cover no-repeat; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        .bg-ricevimento-blur { background: url('sfondo3pagina.jpeg') center/cover no-repeat; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; filter: blur(15px) brightness(0.85); -webkit-filter: blur(15px) brightness(0.85); }

        .inner-slide {
            height: 100svh; width: 100%; scroll-snap-align: start;
            position: relative; display: flex; justify-content: center;
            align-items: center; z-index: 10; background: transparent;
        }

        .pull-up { margin-top: -100svh; }

        /* BOX TESTO */
        .testo-overlay {
            position: relative; z-index: 100;
            background: rgba(255, 255, 255, 0.94); padding: 40px 25px;
            border-radius: 20px; width: 85%; max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            /* Fix per iPhone: forza il testo sopra lo sfondo */
            transform: translateZ(10px); -webkit-transform: translateZ(10px);
        }

        /* SEZIONI FINALI */
        .regalo { background: #fff; z-index: 30; }
        .iban-box { background: #fdfaf7; padding: 20px; border: 1px dashed #d1c4be; font-family: monospace; margin: 20px 0; word-break: break-all; font-size: 1.1rem; text-align: center; }
        .rsvp { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('sfondo5pagina.jpeg') center/cover no-repeat; color: white; z-index: 30; }

        /* UTILITY */
        h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 10px; text-align: center; }
        h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 15px; color: #8d7d77; text-align: center; }
        .btn { display: inline-block; padding: 14px 28px; background: #8d7d77; color: white; text-decoration: none; border-radius: 8px; margin-top: 15px; font-weight: 600; text-align: center; }
        .hint { position: absolute; bottom: 30px; font-size: 0.7rem; color: white; animation: bounce 2s infinite; text-align: center; width: 100%; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} }
    </style>
</head>
<body>

    <div class="scroll-container">
        
        <section class="slide hero">
            <h1>Babbu e Cochi</h1>
            <p style="letter-spacing: 3px;">12 SETTEMBRE 2026</p>
            <div class="hint">↓</div>
        </section>

        <div class="sticky-wrapper" id="wrapper-messa">
            <div class="sticky-bg-group">
                <div class="bg-messa-blur"></div>
                <div id="messa-sharp" class="bg-messa-sharp"></div>
            </div>
            <section class="inner-slide pull-up">
                <div class="hint" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">La Cerimonia ↓</div>
            </section>
            <section class="inner-slide">
                <div class="testo-overlay">
                    <h2>S. Messa</h2>
                    <p>Ore 11:00</p>
                    <p><strong>Chiesa dei Santi Apollinare e Materno</strong></p>
                    <a href="https://maps.app.goo.gl/jtSGPfWMDuj2Wun47" target="_blank" class="btn">📍 Apri Mappa</a>
                </div>
            </section>
        </div>

        <div class="sticky-wrapper" id="wrapper-ricevimento">
            <div class="sticky-bg-group">
                <div class="bg-ricevimento-blur"></div>
                <div id="ricevimento-sharp" class="bg-ricevimento-sharp"></div>
            </div>
            <section class="inner-slide pull-up">
                <div class="hint" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Il Ricevimento ↓</div>
            </section>
            <section class="inner-slide">
                <div class="testo-overlay">
                    <h2>Ricevimento</h2>
                    <p>Villa Ex Magni Rizzoli</p>
                    <p>Canzo (CO)</p>
                    <a href="https://maps.app.goo.gl/A4pXxr4C4FScMBsc9" target="_blank" class="btn">📍 Naviga</a>
                </div>
            </section>
        </div>

        <section class="slide regalo">
            <h2>Un Pensiero</h2>
            <div class="iban-box">IT57K0347501605CC0012832005</div>
            <p style="font-size: 0.8rem; color: #888; text-align: center;">Intestato a Luca Tosoni</p>
        </section>

        <section class="slide rsvp">
            <h2>Ci sarete?</h2>
            <a href="https://forms.gle/EEas74Vv7GRVLyHr6" target="_blank" class="btn" style="background:white; color:#8d7d77;">CONFERMA ORA</a>
        </section>

    </div>

    <script>
const scroller = document.querySelector('.scroll-container');
const messaSharp = document.getElementById('messa-sharp');
const ricevimentoSharp = document.getElementById('ricevimento-sharp');
const wrapperMessa = document.getElementById('wrapper-messa');
const wrapperRicevimento = document.getElementById('wrapper-ricevimento');

scroller.addEventListener('scroll', () => {
    const scrollTop = scroller.scrollTop;
    const vh = window.innerHeight;

    // --- LOGICA MESSA ---
    const startMessa = wrapperMessa.offsetTop;
    const endMessa = startMessa + vh;

    if (scrollTop >= startMessa && scrollTop <= endMessa) {
        // Calcola opacità: da 1 a 0 mentre scendi nella seconda metà del wrapper
        let progress = (scrollTop - startMessa) / vh;
        let opacity = 1 - (progress * 2.5); 
        messaSharp.style.opacity = Math.max(0, Math.min(1, opacity));
    } else if (scrollTop < startMessa) {
        messaSharp.style.opacity = 1;
    } else {
        messaSharp.style.opacity = 0;
    }

    // --- LOGICA RICEVIMENTO ---
    const startRicevimento = wrapperRicevimento.offsetTop;
    const endRicevimento = startRicevimento + vh;

    // Fix Z-index per iPhone che non rompe Android
    if (scrollTop > startRicevimento - (vh / 2)) {
        wrapperMessa.style.zIndex = "1";
        wrapperRicevimento.style.zIndex = "20";
    } else {
        wrapperMessa.style.zIndex = "20";
        wrapperRicevimento.style.zIndex = "1";
    }

    if (scrollTop >= startRicevimento && scrollTop <= endRicevimento) {
        let progress = (scrollTop - startRicevimento) / vh;
        let opacity = 1 - (progress * 2.5);
        ricevimentoSharp.style.opacity = Math.max(0, Math.min(1, opacity));
    } else if (scrollTop < startRicevimento) {
        ricevimentoSharp.style.opacity = 1;
    } else {
        ricevimentoSharp.style.opacity = 0;
    }
});
</script>
</body>
</html>
