<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrimonio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Montserrat&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; width: 100%; 
            overflow: hidden; 
            background-color: #000;
        }

        /* Il contenitore che permette lo scroll */
        .scroll-container {
            width: 100%;
            height: 100svh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .slide {
            width: 100%;
            height: 100svh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- LOGICA SFONDI FISSI --- */
        
        /* Questo è lo sfondo che resta fermo per le due slide della messa */
        .messa-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('sfondo2pagina.jpeg');
            background-size: cover;
            background-position: center;
            z-index: -1; /* Sta dietro a tutto */
        }

        /* --- SLIDE 1: HOME --- */
        .hero {
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('sfondo1pagina.jpeg');
            background-size: cover;
            background-position: center;
            z-index: 10; /* Copre lo sfondo della messa quando sei qui */
            color: white;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 15svh;
        }

        /* --- SLIDE 2: MESSA FOTO (Trasparente) --- */
        .messa-foto-vuota {
            background: transparent; /* Fa vedere la .messa-background sotto */
        }

        /* --- SLIDE 3: MESSA TESTO (Sfoca lo sfondo) --- */
        .messa-info {
            background: transparent;
        }

        /* Il velo che sfoca compare solo in questa slide */
        .blur-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(10px) brightness(0.8);
            -webkit-backdrop-filter: blur(10px) brightness(0.8);
            background-color: rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        .testo-overlay {
            position: relative;
            z-index: 2;
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* --- ALTRE SEZIONI (Coprono lo sfondo fisso) --- */
        .ricevimento {
            background: white;
            z-index: 10;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; }
        .btn { display: inline-block; padding: 12px 25px; background: #8d7d77; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; font-weight: 600; }
        .hint { position: absolute; bottom: 30px; color: white; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="messa-background"></div>

    <div class="scroll-container">
        
        <section class="slide hero">
            <h1>Marco & Giulia</h1>
            <p style="letter-spacing: 3px;">15 GIUGNO 2026</p>
            <div class="hint">Scorri per iniziare ↓</div>
        </section>

        <section class="slide messa-foto-vuota">
            <div class="hint" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Scorri per i dettagli ↓</div>
        </section>

        <section class="slide messa-info">
            <div class="blur-layer"></div>
            <div class="testo-overlay">
                <h2 style="font-family:'Playfair Display'; color:#8d7d77; margin-bottom:10px;">La Cerimonia</h2>
                <p>Ore 11:00</p>
                <p><strong>Chiesa di San Salvatore</strong></p>
                <a href="#" class="btn">📍 Apri Mappa</a>
            </div>
        </section>

        <section class="slide ricevimento" style="background-image: url('sfondo3pagina.jpeg'); background-size: cover; background-position: center;">
            <div style="background: rgba(255,255,255,0.8); padding: 40px; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <h2 style="font-family:'Playfair Display';">Ricevimento</h2>
                <p>Villa Bella Vista</p>
                <a href="#" class="btn">📍 Naviga</a>
            </div>
        </section>

    </div>

</body>
</html>
