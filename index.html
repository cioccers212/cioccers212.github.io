<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Babbu & Cochi - 29.09.2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- RESET E BASI --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
        }

        /* Il contenitore di scroll deve essere pulito per iPhone */
        .scroll-container {
            width: 100%;
            height: 100vh;
            height: 100svh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        .slide {
            width: 100%;
            height: 100vh;
            height: 100svh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        /* --- LOGICA SFONDI FISSI (Modificata per Safari) --- */
        .fixed-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        /* --- 1. HOME --- */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url('sfondo1pagina.jpeg') center/cover no-repeat;
            color: white;
            justify-content: flex-start;
            padding-top: 15vh;
            z-index: 20;
        }

        /* --- BOX TESTO --- */
        .testo-overlay {
            background: rgba(255, 255, 255, 0.94); 
            padding: 40px 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            /* Forza sfocatura dello sfondo sottostante su iPhone */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* --- SPECIFICHE SLIDE --- */
        .transparent-slide { background: transparent; }

        /* --- SEZIONI FINALI --- */
        .regalo { background: #fff; z-index: 30; }
        .iban-box { background: #fdfaf7; padding: 20px; border: 1px dashed #d1c4be; font-family: monospace; margin: 20px 0; word-break: break-all; font-size: 1.1rem; }
        .rsvp { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('sfondo5pagina.jpeg') center/cover no-repeat; color: white; z-index: 30; }

        /* --- UTILITY --- */
        h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 10px; }
        h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 15px; color: #8d7d77; }
        .btn { display: inline-block; padding: 14px 28px; background: #8d7d77; color: white; text-decoration: none; border-radius: 8px; margin-top: 15px; font-weight: 600; }
        .hint { position: absolute; bottom: 30px; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: white; animation: bounce 2s infinite; width: 100%; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} }
    </style>
</head>
<body>

    <div id="bg-messa" class="fixed-bg" style="background-image: url('sfondo2pagina.jpeg');"></div>
    <div id="bg-ricevimento" class="fixed-bg" style="background-image: url('sfondo3pagina.jpeg');"></div>

    <div class="scroll-container" id="main-scroller">
        
        <section class="slide hero" data-bg="none">
            <h1>Babbu e Cochi</h1>
            <p style="letter-spacing: 3px;">12 SETTEMBRE 2026</p>
            <div class="hint">↓</div>
        </section>

        <section class="slide transparent-slide" data-bg="messa">
            <div class="hint" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">La Cerimonia ↓</div>
        </section>

        <section class="slide transparent-slide" data-bg="messa">
            <div class="testo-overlay">
                <h2>S. Messa</h2>
                <p>Ore 11:00</p>
                <p><strong>Chiesa dei Santi Apollinare e Materno</strong></p>
                <a href="#" class="btn">📍 Apri Mappa</a>
            </div>
        </section>

        <section class="slide transparent-slide" data-bg="ricevimento">
            <div class="hint" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Il Ricevimento ↓</div>
        </section>

        <section class="slide transparent-slide" data-bg="ricevimento">
            <div class="testo-overlay">
                <h2>Ricevimento</h2>
                <p>Villa Ex Magni Rizzoli</p>
                <p>Canzo (CO)</p>
                <a href="#" class="btn">📍 Naviga</a>
            </div>
        </section>

        <section class="slide regalo" data-bg="none">
            <h2>Un Pensiero</h2>
            <div class="iban-box">IT57K0347501605CC0012832005</div>
            <p style="font-size: 0.8rem; color: #888;">Intestato a Luca Tosoni</p>
        </section>

        <section class="slide rsvp" data-bg="none">
            <h2>Ci sarete?</h2>
            <a href="#" class="btn" style="background:white; color:#8d7d77;">CONFERMA ORA</a>
        </section>

    </div>

    <script>
        const scroller = document.getElementById('main-scroller');
        const bgMessa = document.getElementById('bg-messa');
        const bgRicevimento = document.getElementById('bg-ricevimento');
        const slides = document.querySelectorAll('.slide');

        scroller.addEventListener('scroll', () => {
            let currentSlide = "";
            const scrollTop = scroller.scrollTop;
            const height = window.innerHeight;

            slides.forEach(slide => {
                const slideTop = slide.offsetTop;
                if (scrollTop >= slideTop - height / 2) {
                    currentSlide = slide.getAttribute('data-bg');
                }
            });

            // Gestione apparizione sfondi
            if (currentSlide === "messa") {
                bgMessa.style.opacity = "1";
                bgRicevimento.style.opacity = "0";
            } else if (currentSlide === "ricevimento") {
                bgMessa.style.opacity = "0";
                bgRicevimento.style.opacity = "1";
            } else {
                bgMessa.style.opacity = "0";
                bgRicevimento.style.opacity = "0";
            }
        });
    </script>

</body>
</html>
