<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Babbu e Cochi - 12.09.2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scroll-container" id="main-container">
        
        <section class="slide hero">
            <h1>Babbu e Cochi</h1>
            <p style="letter-spacing: 3px;">12 SETTEMBRE 2026</p>
            <div class="hint">↓</div>
        </section>

        <div class="sticky-wrapper" id="wrapper-messa">
            <div class="sticky-bg-group">
                <div class="bg-messa-blur"></div>
                <div id="messa-sharp" class="bg-messa-sharp"></div>
            </div>
            <section class="inner-slide pull-up">
                <div class="hint" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">La Cerimonia ↓</div>
            </section>
            <section class="inner-slide">
                <div class="testo-overlay">
                    <h2>S. Messa</h2>
                    <p>Ore 11:00</p>
                    <p><strong>Chiesa dei Santi Apollinare e Materno</strong></p>
                    <a href="https://maps.app.goo.gl/jtSGPfWMDuj2Wun47" target="_blank" class="btn">📍 Apri Mappa</a>
                </div>
            </section>
        </div>

        <div class="sticky-wrapper" id="wrapper-ricevimento">
            <div class="sticky-bg-group">
                <div class="bg-ricevimento-blur"></div>
                <div id="ricevimento-sharp" class="bg-ricevimento-sharp"></div>
            </div>
            <section class="inner-slide pull-up">
                <div class="hint" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Il Ricevimento ↓</div>
            </section>
            <section class="inner-slide">
                <div class="testo-overlay">
                    <h2>Ricevimento</h2>
                    <p>Villa Ex Magni Rizzoli</p>
                    <p>Canzo (CO)</p>
                    <a href="https://maps.app.goo.gl/A4pXxr4C4FScMBsc9" target="_blank" class="btn">📍 Naviga</a>
                </div>
            </section>
        </div>

        <section class="slide regalo">
            <h2>Un Pensiero</h2>
            <div class="iban-box">IT57K0347501605CC0012832005</div>
            <p style="font-size: 0.8rem; color: #888; text-align: center;">Intestato a Luca Tosoni</p>
        </section>

        <section class="slide rsvp">
            <h2>Ci sarete?</h2>
            <a href="https://forms.gle/EEas74Vv7GRVLyHr6" target="_blank" class="btn" style="background:white; color:#8d7d77;">CONFERMA ORA</a>
        </section>

    </div>

    <script>
        const container = document.getElementById('main-container');
        const messaSharp = document.getElementById('messa-sharp');
        const wrapMessa = document.getElementById('wrapper-messa');
        const ricevimentoSharp = document.getElementById('ricevimento-sharp');
        const wrapRicevimento = document.getElementById('wrapper-ricevimento');

        let isScrolling = false;
        let touchStartY = 0;

        // --- SISTEMA ANTI-SLIP PER BLOCCARE LO SCROLL MULTIPLO ---
        container.addEventListener('touchstart', e => { 
            touchStartY = e.touches[0].clientY; 
        }, {passive: true});
        
        container.addEventListener('touchmove', e => { 
            if(isScrolling) e.preventDefault(); 
        }, {passive: false});

        container.addEventListener('touchend', e => {
            const touchEndY = e.changedTouches[0].clientY;
            const delta = touchStartY - touchEndY;
            if (Math.abs(delta) > 50 && !isScrolling) {
                performSnap(delta > 0 ? 1 : -1);
            }
        }, {passive: true});

        container.addEventListener('wheel', e => {
            e.preventDefault();
            if(!isScrolling) performSnap(e.deltaY > 0 ? 1 : -1);
        }, {passive: false});

        function performSnap(direction) {
            const vh = window.innerHeight;
            const currentScroll = container.scrollTop;
            let target = Math.round(currentScroll / vh) * vh + (direction * vh);
            
            target = Math.max(0, Math.min(target, container.scrollHeight - vh));

            isScrolling = true;
            container.scrollTo({ top: target, behavior: 'smooth' });
            
            setTimeout(() => { isScrolling = false; }, 800);
        }

        // --- GESTIONE SFOCATURA DINAMICA E LIVELLI Z-INDEX ---
        container.addEventListener('scroll', () => {
            const st = container.scrollTop;
            const vh = window.innerHeight;

            // Blur Messa
            const offMessa = wrapMessa.offsetTop;
            if (st >= offMessa && st <= offMessa + vh) {
                let op = 1 - ((st - offMessa) / vh * 2.5);
                messaSharp.style.opacity = Math.max(0, Math.min(1, op));
            } else if (st < offMessa) {
                messaSharp.style.opacity = 1;
            }

            // Fix Z-Index e Blur Ricevimento
            const offRicevimento = wrapRicevimento.offsetTop;
            if (st > offRicevimento - (vh/2)) {
                wrapMessa.style.zIndex = "1";
                wrapRicevimento.style.zIndex = "20";
            } else {
                wrapMessa.style.zIndex = "20";
                wrapRicevimento.style.zIndex = "1";
            }

            if (st >= offRicevimento && st <= offRicevimento + vh) {
                let op = 1 - ((st - offRicevimento) / vh * 2.5);
                ricevimentoSharp.style.opacity = Math.max(0, Math.min(1, op));
            } else if (st < offRicevimento) {
                ricevimentoSharp.style.opacity = 1;
            }
        });
    </script>
</body>
</html>
