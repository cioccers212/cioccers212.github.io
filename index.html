<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Babbu e Cochi - 12.09.2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- RESET E BASI --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
        }

        .scroll-container {
            width: 100%;
            height: 100svh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .slide {
            width: 100%;
            height: 100svh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        /* --- 1. HOME --- */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url('sfondo1pagina.jpeg') center/cover no-repeat;
            color: white;
            justify-content: flex-start;
            padding-top: 15svh;
            z-index: 20;
        }

        /* --- LOGICA WRAPPER (MESSA E RICEVIMENTO) --- */
        .sticky-wrapper {
            height: 200vh;
            position: relative;
            z-index: 5;
        }

        .sticky-bg-group {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
        }

        /* Immagini per la Messa */
        .bg-messa-sharp { background: url('sfondo2pagina.jpeg') center/cover no-repeat; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        .bg-messa-blur { background: url('sfondo2pagina.jpeg') center/cover no-repeat; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; filter: blur(15px) brightness(0.85); -webkit-filter: blur(15px) brightness(0.85); }

        /* Immagini per il Ricevimento */
        .bg-ricevimento-sharp { background: url('sfondo3pagina.jpeg') center/cover no-repeat; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        .bg-ricevimento-blur { background: url('sfondo3pagina.jpeg') center/cover no-repeat; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; filter: blur(15px) brightness(0.85); -webkit-filter: blur(15px) brightness(0.85); }

        .inner-slide {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: transparent;
        }

        .pull-up { margin-top: -100vh; }

        /* --- BOX TESTO (MODIFICATO PER CENTRATURA) --- */
        .testo-overlay {
            position: relative;
            z-index: 20;
            background: rgba(255, 255, 255, 0.92); 
            padding: 40px 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center; /* FORZA CENTRATURA TESTO */
        }

        /* --- SEZIONI FINALI --- */
        .regalo { background: #fff; z-index: 30; }
        .iban-box { background: #fdfaf7; padding: 20px; border: 1px dashed #d1c4be; font-family: monospace; margin: 20px 0; word-break: break-all; font-size: 1.1rem; text-align: center; }
        .rsvp { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('sfondo5pagina.jpeg') center/cover no-repeat; color: white; z-index: 30; }

        /* --- UTILITY --- */
        h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 10px; text-align: center; }
        h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 15px; color: #8d7d77; text-align: center; }
        .btn { display: inline-block; padding: 14px 28px; background: #8d7d77; color: white; text-decoration: none; border-radius: 8px; margin-top: 15px; font-weight: 600; text-align: center; }
        .hint { position: absolute; bottom: 30px; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: white; animation: bounce 2s infinite; text-align: center; width: 100%; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} }
    </style>
</head>
<body>

    <div class="scroll-container">
        
        <section class="slide hero">
            <h1>Babbu e Cochi</h1>
            <p style="letter-spacing: 3px;">12 SETTEMBRE 2026</p>
            <div class="hint">↓</div>
        </section>

        <div class="sticky-wrapper" id="wrapper-messa">
            <div class="sticky-bg-group">
                <div class="bg-messa-blur"></div>
                <div class="bg-messa-sharp" id="messa-sharp"></div>
            </div>
            <section class="inner-slide pull-up">
                <div class="hint" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">La Cerimonia ↓</div>
            </section>
            <section class="inner-slide">
                <div class="testo-overlay">
                    <h2>S. Messa</h2>
                    <p>Ore 11:00</p>
                    <p><strong>Chiesa dei Santi Apollinare e Materno</strong></p>
                    <a href="https://maps.app.goo.gl/jtSGPfWMDuj2Wun47" class="btn">📍 Apri Mappa</a>
                </div>
            </section>
        </div>

        <div class="sticky-wrapper" id="wrapper-ricevimento">
            <div class="sticky-bg-group">
                <div class="bg-ricevimento-blur"></div>
                <div class="bg-ricevimento-sharp" id="ricevimento-sharp"></div>
            </div>
            <section class="inner-slide pull-up">
                <div class="hint" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Il Ricevimento ↓</div>
            </section>
            <section class="inner-slide">
                <div class="testo-overlay">
                    <h2>Ricevimento</h2>
                    <p>Villa Ex Magni Rizzoli</p>
                    <p>Canzo (CO)</p>
                    <a href="https://maps.app.goo.gl/A4pXxr4C4FScMBsc9" class="btn">📍 Naviga</a>
                </div>
            </section>
        </div>

        <section class="slide regalo">
            <h2>Un Pensiero</h2>
            <div class="iban-box">IT57K0347501605CC0012832005</div>
            <p style="font-size: 0.8rem; color: #888; text-align: center;">Intestato a Luca Tosoni</p>
        </section>

        <section class="slide rsvp">
            <h2>Ci sarete?</h2>
            <a href="https://forms.gle/EEas74Vv7GRVLyHr6" class="btn" style="background:white; color:#8d7d77;">CONFERMA ORA</a>
        </section>

    </div>

    <script>
    const scrollContainer = document.querySelector('.scroll-container');
    const windowHeight = window.innerHeight;

    const messaSharp = document.getElementById('messa-sharp');
    const wrapperMessa = document.getElementById('wrapper-messa');
    const ricevimentoSharp = document.getElementById('ricevimento-sharp');
    const wrapperRicevimento = document.getElementById('wrapper-ricevimento');

    scrollContainer.addEventListener('scroll', () => {
        const currentScroll = scrollContainer.scrollTop;

        // SFOCATURA MESSA
        const startMessa = wrapperMessa.offsetTop;
        if (currentScroll >= startMessa && currentScroll <= startMessa + windowHeight) {
            let opacity = 1 - ((currentScroll - startMessa) / windowHeight * 3.0);
            messaSharp.style.opacity = Math.max(0, Math.min(1, opacity));
        } else if (currentScroll < startMessa) {
            messaSharp.style.opacity = 1;
        }

        // SFOCATURA RICEVIMENTO
        const startRicevimento = wrapperRicevimento.offsetTop;
        if (currentScroll >= startRicevimento && currentScroll <= startRicevimento + windowHeight) {
            let opacity = 1 - ((currentScroll - startRicevimento) / windowHeight * 3.0);
            ricevimentoSharp.style.opacity = Math.max(0, Math.min(1, opacity));
        } else if (currentScroll < startRicevimento) {
            ricevimentoSharp.style.opacity = 1;
        }
    });
    </script>

</body>
</html>
