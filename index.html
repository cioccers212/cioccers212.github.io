<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrimonio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Montserrat&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; width: 100%; 
            overflow: hidden; 
            background-color: #222; /* Se vedi nero, il codice funziona ma non trova le foto */
        }

        .scroll-container {
            width: 100%;
            height: 100svh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .slide {
            width: 100%;
            height: 100svh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- SEZIONI CON IMMAGINI --- */
        
        .hero { 
            /* Se non vedi la foto, controlla che si chiami esattamente così */
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('sfondo1pagina.jpeg'); 
            background-color: #fdf6f0; /* Colore di riserva */
            justify-content: flex-start;
            padding-top: 15svh;
            color: white;
        }

        .messa-foto { 
            background-image: url('sfondo2pagina.jpeg'); 
            background-color: #e8eaf6; 
        }

        .messa-testo { 
            background-image: url('sfondo2pagina.jpeg'); 
            background-color: #e8eaf6; 
        }

        /* Effetto Sfocatura */
        .sfondo-sfocato {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(15px) brightness(0.8);
            -webkit-backdrop-filter: blur(15px) brightness(0.8);
            background-color: rgba(255,255,255,0.2);
        }

        .testo-overlay {
            position: relative;
            z-index: 10;
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 85%;
            max-width: 350px;
            font-family: 'Montserrat', sans-serif;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; }
        .btn { display: inline-block; padding: 12px 20px; background: #8d7d77; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="scroll-container">
        
        <section class="slide hero">
            <h1>Marco & Giulia</h1>
            <p>15 GIUGNO 2026</p>
        </section>

        <section class="slide messa-foto">
            <p style="color:white; background:rgba(0,0,0,0.4); padding:5px;">Scorri per i dettagli ↓</p>
        </section>

        <section class="slide messa-testo">
            <div class="sfondo-sfocato"></div>
            <div class="testo-overlay">
                <h2 style="font-family:'Playfair Display'; margin-bottom:10px;">La Cerimonia</h2>
                <p>Ore 11:00 - Chiesa di San Salvatore</p>
                <a href="#" class="btn">📍 Mappa</a>
            </div>
        </section>

    </div>

</body>
</html>
